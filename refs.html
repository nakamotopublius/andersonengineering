<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>References · Anderson Engineering</title>
<style>
  :root{--ink:#1f2430;--muted:#5b6272;--line:#d9dde5;--bg:#f7f8fa;--card:#fff;--accent:#1f3a5f}
  @media (prefers-color-scheme:dark){:root{--ink:#e8eaf0;--muted:#a3a9b8;--line:#343a48;--bg:#14171d;--card:#1d212a;--accent:#8fb0ff}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:2}
  .top button{color:var(--accent);font-size:15px;background:none;border:0;padding:0;cursor:pointer}
  .top .t{font-weight:600;font-size:15px;flex:1;text-align:center}
  main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
  h1{font-size:20px;margin:6px 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
  a.r,div.r{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:10px;text-decoration:none;color:var(--ink)}
  a.r b,div.r b{display:block;color:var(--accent);font-size:16px}
  div.r b{color:var(--ink)}
  a.r .a,div.r .a{font-size:14px;color:var(--muted)}
  a.r .n,div.r .n{font-size:14px;margin-top:4px}
  a.r .w,div.r .w{font-size:12px;color:var(--muted);margin-top:4px}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:400;vertical-align:middle}
  .note{color:var(--muted);font-size:13px;margin-top:20px}
</style>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div class="top"><button id="back">‹ Course</button><div class="t">References</div><span style="width:56px"></span></div>
<main id="app"><p class="sub">Loading…</p></main>
<script>
(function(){
function basePrefix(){
  var host=location.hostname.toLowerCase();
  if(host==='andersonengineering.app'||host==='www.andersonengineering.app'||host.endsWith('.andersonengineering.app')) return '';
  if(host.endsWith('github.io')){
    var m=location.pathname.match(/^\/andersonengineering(?=\/|$)/);
    return m?'/andersonengineering':'';
  }
  return '';
}
var BASE=basePrefix();
var app=document.getElementById('app'),code=(new URLSearchParams(location.search).get('c')||'').replace(/[^A-Za-z0-9-]/g,'');
document.getElementById('back').onclick=function(){if(code)location.href=(BASE||'')+'/'+code+'/';else history.back()};
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var G=[['book','Books'],['open','Open course materials'],['web','Web'],['course','Related Anderson Engineering courses']];
fetch((BASE||'')+'/refs/'+code+'.json?'+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
 var h='<h1>'+esc(d.code)+'</h1><p class="sub">'+esc(d.title)+' — books, sources and further reading mentioned in the course.</p>',amz=false;
 G.forEach(function(g){var L=(d.items||[]).filter(function(i){return i.type===g[0]});if(!L.length)return;h+='<h2>'+g[1]+'</h2>';
  L.forEach(function(i){var ref=i.url&&/amazon\.com/.test(i.url);if(ref)amz=true;
   var inner='<b>'+esc(i.title)+(ref?'<span class="tag">referral link</span>':'')+'</b>'+(i.author?'<div class="a">'+esc(i.author)+(i.year?', '+esc(i.year):'')+'</div>':'')+(i.note?'<div class="n">'+esc(i.note)+'</div>':'')+(i.where?'<div class="w">Mentioned in ¶ '+esc(i.where)+'</div>':'');
   if(i.url) h+='<a class="r" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+inner+'</a>';
   else h+='<div class="r">'+inner+'</div>';
  })});
 if(amz)h+='<p class="note">Book links are Amazon referral links: buying through them supports Anderson Engineering. Libraries are a fine alternative.</p>';
 app.innerHTML=h}).catch(function(){app.innerHTML='<p class="sub">References for this course are not available yet.</p>'});
})();
</script>
</body>
</html>
