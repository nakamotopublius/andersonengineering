  function applyTheme(t){
    const root=document.documentElement;
    if(t==='dark'||t==='light'){root.setAttribute('data-theme',t);} else {root.removeAttribute('data-theme'); t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
    const b=document.getElementById('themeBtn');
    if(b) b.textContent=(t==='dark'?'Light':'Dark');
  }
  (function(){
    let t=null; try{t=localStorage.getItem('aa_theme');}catch(e){}
    applyTheme(t==='dark'||t==='light'?t:null);
    const b=document.getElementById('themeBtn');
    if(b) b.onclick=()=>{
      const cur=document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
      const next=cur==='dark'?'light':'dark';
      try{localStorage.setItem('aa_theme',next);}catch(e){}
      applyTheme(next);
    };
  })();

(function(){
  const app=document.getElementById('app'), tEl=document.getElementById('timer'), cnt=document.getElementById('cnt'), back=document.getElementById('back');
  const L='ABCD', LIMIT=60*60;
  const D=window.EXAM_DATA;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let picks=[], t0=null, tick=null, finished=false, used=0;

  function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function runTimer(){
    t0=Date.now();
    tick=setInterval(()=>{
      const s=(Date.now()-t0)/1000;
      tEl.textContent=fmt(s);
      tEl.classList.toggle('over', s>=LIMIT);
    },250);
  }
  function count(){const n=picks.filter(p=>p!=null).length;cnt.textContent=n+' / '+D.questions.length;return n;}

  function start(){
    document.getElementById('tnote').textContent='This timer is for reference only. This test is designed for 60 minutes.';
    picks=D.questions.map(()=>null); finished=false;
    back.style.visibility='hidden';
    let h='<p class="brand">Anderson Academy · Anderson Engineering</p><h1>'+esc(D.title||'Final Exam')+'</h1><p class="sub">Final Exam · '+D.questions.length+' questions. Choose one answer for each question; you can change an answer at any time. Your score and the explanations appear after you submit. No score is stored.</p>';
    D.questions.forEach((x,i)=>{
      h+='<div class="card" id="q'+i+'"><div class="qn">Question '+(i+1)+' of '+D.questions.length+'</div><p class="q">'+esc(x.q)+'</p>';
      x.options.forEach((o,j)=>h+='<button class="opt" data-i="'+i+'" data-j="'+j+'"><b>'+L[j]+'.</b><span>'+esc(o)+'</span></button>');
      h+='</div>';
    });
    h+='<button class="btn" id="submit">Submit exam</button><div id="confirm"></div>';
    app.innerHTML=h;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, j=+b.dataset.j; picks[i]=j;
      document.querySelectorAll('#q'+i+' .opt').forEach(o=>o.classList.toggle('on',+o.dataset.j===j));
      count(); document.getElementById('confirm').innerHTML='';
    });
    document.getElementById('submit').onclick=trySubmit;
    count(); clearInterval(tick); tEl.classList.remove('over'); tEl.textContent='0:00'; runTimer(); window.scrollTo(0,0);
  }
  function trySubmit(){
    const left=D.questions.length-count();
    if(left===0) return submit();
    const first=picks.findIndex(p=>p==null)+1;
    document.getElementById('confirm').innerHTML='<div class="warn">You have '+left+' unanswered question'+(left>1?'s':'')+' (the first is question '+first+'). Unanswered questions count as wrong.<button class="btn" id="anyway">Submit anyway</button><button class="btn alt" id="goq">Go to question '+first+'</button></div>';
    document.getElementById('anyway').onclick=submit;
    document.getElementById('goq').onclick=()=>document.getElementById('q'+(first-1)).scrollIntoView({behavior:'smooth',block:'center'});
  }
  function submit(){
    finished=true; clearInterval(tick); used=(Date.now()-t0)/1000;
    tEl.textContent=fmt(used)+' used';
    tEl.classList.toggle('over', used>=LIMIT);
    back.style.visibility='visible';
    back.textContent='‹ Exam';
    back.onclick=()=>start();
    results('all');
  }
  function results(mode){
    const n=D.questions.length, right=D.questions.filter((x,i)=>picks[i]===x.answer).length;
    let h='<div class="card"><div class="qn">'+esc(D.title||'Final Exam')+'</div><div class="score">'+right+' / '+n+'</div><p class="sub" style="text-align:center;margin:0">'+Math.round(100*right/n)+'% · time used '+fmt(used)+'</p><p class="note">This score is only on this screen. Nothing is stored.</p></div>';
    h+='<div class="tabs"><button id="tAll" class="'+(mode==='all'?'on':'')+'">All questions</button><button id="tMiss" class="'+(mode==='miss'?'on':'')+'">Missed only ('+(n-right)+')</button></div>';
    D.questions.forEach((x,i)=>{
      const p=picks[i], ok=p===x.answer;
      if(mode==='miss'&&ok) return;
      h+='<div class="card"><div class="qn">Question '+(i+1)+'</div><p class="q">'+esc(x.q)+'</p>';
      x.options.forEach((o,j)=>h+='<button class="opt '+(j===x.answer?'ok':(j===p?'bad':''))+'" disabled><b>'+L[j]+'.</b><span>'+esc(o)+'</span></button>');
      h+='<div class="fb '+(ok?'ok':'bad')+'"><strong>'+(ok?'Correct.':(p==null?'Not answered. The answer is '+L[x.answer]+'.':'You chose '+L[p]+'. The answer is '+L[x.answer]+'.'))+'</strong>'+esc(x.explain)+'</div></div>';
    });
    h+='<button class="btn" id="again">Take the exam again</button>';
    app.innerHTML=h;
    document.getElementById('tAll').onclick=()=>results('all');
    document.getElementById('tMiss').onclick=()=>results('miss');
    document.getElementById('again').onclick=start;
    window.scrollTo(0,0);
  }
  start();
})();
</script>
