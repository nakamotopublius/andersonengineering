<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGR 507 B · Interactive Lecture Quizzes · Anderson Academy</title>
<meta name="theme-color" content="#1f3a5f">
<style>
  :root{--ink:#1b2230;--muted:#586075;--line:#ddd8cb;--bg:#f7f5f0;--card:#fff;--ok:#1d7a46;--okbg:#e6f4ec;--bad:#b3261e;--badbg:#fbeaea;--accent:#1f3a5f;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9ecf2;--muted:#a3abbd;--line:#2c3547;--bg:#141922;--card:#1c2330;--ok:#8fcdb0;--okbg:#1a3b2a;--bad:#f0a8a4;--badbg:#3b1c1c;--accent:#8fb4e8;color-scheme:dark}}
  :root[data-theme="dark"]{--ink:#e9ecf2;--muted:#a3abbd;--line:#2c3547;--bg:#141922;--card:#1c2330;--ok:#8fcdb0;--okbg:#1a3b2a;--bad:#f0a8a4;--badbg:#3b1c1c;--accent:#8fb4e8;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:2;padding-top:max(10px,env(safe-area-inset-top,0px))}
  .top button.back,.top button.theme{color:var(--accent);text-decoration:none;font-size:15px;background:none;border:0;padding:0;cursor:pointer}
  .top button.theme{min-width:44px;text-align:right}
  .top .t{font-weight:600;font-size:15px;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  h1{font-size:20px;margin:6px 0 4px}
  .brand{color:var(--muted);font-size:13px;letter-spacing:.02em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .qlist button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;font-size:16px;color:var(--ink);cursor:pointer}
  .qlist .n{font-weight:700;color:var(--accent);min-width:58px}
  .qlist .s{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;text-align:right}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .prog{color:var(--muted);font-size:13px;margin-bottom:8px}
  .q{font-size:17px;font-weight:600;margin:0 0 14px}
  .opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;font-size:16px;color:var(--ink);cursor:pointer}
  .opt b{min-width:20px}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .fb{margin-top:12px;padding:12px;border-radius:10px;font-size:15px;white-space:pre-line}
  .fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
  .fb strong{display:block;margin-bottom:4px}
  .nav{display:flex;gap:10px;margin-top:14px}
  .btn{flex:1;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px;font-size:16px;cursor:pointer}
  :root[data-theme="dark"] .btn{color:#101722}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#101722}}
  .btn.alt{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
  .score{font-size:40px;font-weight:700;text-align:center;margin:8px 0}
  .note{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="top"><button class="back" id="back" type="button">‹ Quizzes</button><div class="t" id="hdr">Interactive Quizzes</div><button class="theme" id="themeBtn" type="button" aria-label="Switch color theme">Dark</button></div>
<main id="app"><p class="sub">Loading…</p></main>
<script>
window.QUIZ_DATA = {
  "title": "ENGR 507 B - Differential Equations",

    {
      "n": 1,

        {
          "q": "Why can two solution curves of a well-behaved first-order equation never cross? [1.4]",

    {
      "n": 2,

        {
          "q": "For y′ + k y = cos ωt, what is the steady-state amplitude? [2.13]",

    {

          "explain": "Paragraph 3.3: Substituting e^(rt) gives (m r² + b r + k) e^(rt) = 0.\nB is wrong: Each derivative contributes a power of r.\nC is wrong: The coefficients stay as m, b, k.\nD is wrong: Signs are preserved."
        },
        {
          "q": "What happens when b² − 4mk > 0? [3.5]",

    {

    {

        {
          "q": "What is the Laplace transform of e^(at)? [5.2]",

            "a/s",
            "1/(s − a)",

          ],
          "answer": 2,
          "explain": "Paragraph 5.2: The integral of e^(−st)e^(at) from 0 to ∞ is 1/(s − a) for s > a.\nA is wrong: That is the transform of e^(−at).\nB is wrong: That is the transform of the constant a.\nD is wrong: That is the transform of 1."
        },
        {
          "q": "What is the Laplace transform of f′? [5.3]",
          "options": [
            "F(s)/s",

            "s F(s)",

          ],

            "Instability",
            "Undamped oscillation",

            "Nothing about the system"
          ],
          "answer": 2,

        },
        {
          "q": "What is the Laplace transform of a system's impulse response? [5.10]",

    {

            "v = 0",

            "The Laplace transform"

  function applyTheme(t){
    const root=document.documentElement;
    if(t==='dark'||t==='light'){root.setAttribute('data-theme',t);} else {root.removeAttribute('data-theme'); t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';}
    const b=document.getElementById('themeBtn');
    if(b) b.textContent=(t==='dark'?'Light':'Dark');
  }
  (function(){
    let t=null; try{t=localStorage.getItem('aa_theme');}catch(e){}
    applyTheme(t==='dark'||t==='light'?t:null);
    const b=document.getElementById('themeBtn');
    if(b) b.onclick=()=>{
      const cur=document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
      const next=cur==='dark'?'light':'dark';
      try{localStorage.setItem('aa_theme',next);}catch(e){}
      applyTheme(next);
    };
  })();

(function(){
  const app=document.getElementById('app'), hdr=document.getElementById('hdr'), back=document.getElementById('back');
  const L='ABCD';
  const D=window.QUIZ_DATA;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function list(){
    back.style.visibility='hidden';
    back.onclick=null;
    hdr.textContent='ENGR 507 B Quizzes';
    let h='<p class="brand">Anderson Academy · Anderson Engineering</p><h1>'+esc(D.title)+'</h1><p class="sub">Pick a lecture quiz. Each answer is explained straight away, with the paragraph to reread. No score is stored.</p><div class="qlist">';
    D.quizzes.forEach((q,i)=>{
      h+='<button data-i="'+i+'"><span class="n">Quiz '+q.n+'</span><span>'+esc(q.title)+'</span><span class="s">'+q.questions.length+' Qs</span></button>';
    });
    app.innerHTML=h+'</div>';
    app.querySelectorAll('.qlist button').forEach(b=>b.onclick=()=>start(+b.dataset.i));
    window.scrollTo(0,0);
  }

  function start(qi){
    const quiz=D.quizzes[qi]; let k=0, right=0;
    back.style.visibility='visible';
    back.onclick=list; back.textContent='‹ Quizzes';
    hdr.textContent='Quiz '+quiz.n;
    function show(){
      const x=quiz.questions[k];
      let h='<div class="card"><div class="prog">Quiz '+quiz.n+' · Question '+(k+1)+' of '+quiz.questions.length+'</div><p class="q">'+esc(x.q)+'</p>';
      x.options.forEach((o,j)=>h+='<button class="opt" data-j="'+j+'"><b>'+L[j]+'.</b><span>'+esc(o)+'</span></button>');
      app.innerHTML=h+'<div id="fb"></div><div class="nav" id="nav"></div></div>';
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.j));
      window.scrollTo(0,0);
    }
    function pick(j){
      const x=quiz.questions[k], ok=j===x.answer; if(ok) right++;
      app.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true; if(i===x.answer) b.classList.add('ok'); else if(i===j) b.classList.add('bad');});
      document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><strong>'+(ok?'Correct.':'Not quite — the answer is '+L[x.answer]+'.')+'</strong>'+esc(x.explain)+'</div>';
      const last=k===quiz.questions.length-1;
      document.getElementById('nav').innerHTML='<button class="btn" id="nx">'+(last?'See score':'Next question')+'</button>';
      document.getElementById('nx').onclick=()=>{ if(last) done(); else {k++;show();} };
      document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    function done(){
      const n=quiz.questions.length, nextQ=qi+1<D.quizzes.length;
      app.innerHTML='<div class="card"><div class="prog">Quiz '+quiz.n+': '+esc(quiz.title)+'</div><div class="score">'+right+' / '+n+'</div>'+
        '<p class="sub" style="text-align:center">'+(right===n?'Every answer right.':'Go back to the paragraphs named in the explanations for the ones you missed.')+'</p>'+
        '<p class="note">This score is only on this screen. Nothing is stored.</p>'+
        '<div class="nav"><button class="btn alt" id="again">Try again</button>'+(nextQ?'<button class="btn" id="nq">Next quiz</button>':'<button class="btn" id="all">All quizzes</button>')+'</div></div>';
      document.getElementById('again').onclick=()=>start(qi);
      if(nextQ) document.getElementById('nq').onclick=()=>start(qi+1); else document.getElementById('all').onclick=list;
      window.scrollTo(0,0);
    }
    show();
  }
  list();
})();
</script>
</body>
</html>
